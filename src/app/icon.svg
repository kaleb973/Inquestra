<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    :root {
      --logo-color: #0f172a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-color: #f8fafc;
      }
    }
    .wave-solid {
      stroke: var(--logo-color);
      stroke-width: 8;
      stroke-linecap: round;
    }
    .wave-dashed {
      stroke: var(--logo-color);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 10 10;
      opacity: 0.5;
    }
    .node-circle {
      fill: var(--logo-color);
    }
  </style>
  <path class="wave-solid" d="M 20 50 C 20 20, 50 20, 50 50 C 50 80, 80 80, 80 50" />
  <path class="wave-dashed" d="M 20 50 C 20 80, 50 80, 50 50 C 50 20, 80 20, 80 50" />
  <circle class="node-circle" cx="20" cy="50" r="8" />
  <circle class="node-circle" cx="80" cy="50" r="8" />
  <circle class="node-circle" cx="50" cy="50" r="6" />
</svg>
