<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    path, circle {
      stroke: #0f172a;
      fill: #0f172a;
    }
    .wave-dashed {
      stroke: #0f172a;
      fill: none;
      opacity: 0.5;
    }
    .wave-solid {
      fill: none;
    }
    @media (prefers-color-scheme: dark) {
      path, circle {
        stroke: #f8fafc;
        fill: #f8fafc;
      }
      .wave-dashed {
        stroke: #f8fafc;
        fill: none;
        opacity: 0.5;
      }
      .wave-solid {
        fill: none;
      }
    }
  </style>
  <path class="wave-solid" d="M 20 50 C 20 20, 50 20, 50 50 C 50 80, 80 80, 80 50" stroke-width="8" stroke-linecap="round" />
  <path class="wave-dashed" d="M 20 50 C 20 80, 50 80, 50 50 C 50 20, 80 20, 80 50" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 10" />
  <circle cx="20" cy="50" r="8" />
  <circle cx="80" cy="50" r="8" />
  <circle cx="50" cy="50" r="6" />
</svg>
